# Deploys to the production server after a commit on main passes the checks (docs/DEPLOY.md, D45).
# Run it by hand from the Actions tab, on main, to redeploy. The checks run first then too.
name: Deploy

on:
  push:
    branches: [main]
    # .dockerignore leaves docs out of the image, so a docs-only push can't change production.
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

# The whole run, checks included, takes the lock. If only the deploy job held it, an older commit
# whose checks finished late could deploy over a newer one. Runs go one at a time, a running one is
# never cancelled (so a merge can't interrupt a migration), and a newer waiting run replaces an older
# waiting run, which it contains.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No secrets are passed to the checks.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p .data
          printf '%s\n' "$DEPLOY_SSH_KEY" > .data/goodbuild-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > .data/known_hosts

      - name: Deploy
        run: deploy/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Check the live site
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://goodbuildit.xyz/ || true)
            echo "attempt $attempt: $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "The site didn't come back after the deploy." >&2
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f .data/goodbuild-deploy
