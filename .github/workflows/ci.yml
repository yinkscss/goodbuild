# Lint, typecheck, full tests and build (docs/DEPLOY.md, D45).
# Runs on every pull request. The Deploy workflow also calls it, so the exact commit on main is
# tested before it ships. Don't add a path filter here: a required check that never reports leaves
# a pull request unable to merge.
name: CI

on:
  pull_request:
  workflow_call:

# A new push to a pull request replaces its old run. A run called by Deploy is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real Postgres for the money tests that need one: PGlite has a single connection, so it
    # can't show races. A throwaway server on the runner; each test file makes and drops its own
    # database (src/server/credits/test-backends.ts). It holds nothing but test data.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the runner's size
        run: |
          nproc
          free -m

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      # The same major version as the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Also installs the publish-runtime workspace, which the build packs.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # PGlite and solc run in-process. TEST_DATABASE_URL adds the Postgres service above, so the
      # race tests also run on what production runs. Workers and timeouts come from vitest.config.mts.
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        timeout-minutes: 20

      - name: Build
        run: pnpm build
        timeout-minutes: 10

      # Starts real containers in a throwaway project. It never touches production.
      - name: Test the release and rollback scripts
        run: bash deploy/test-release.sh
        timeout-minutes: 5

      # Real Postgres, age and MinIO in a throwaway project, with keys made up for the run (D47).
      - name: Test the off-site backup and restore drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
          bash deploy/test-offsite-backup.sh
        timeout-minutes: 8
