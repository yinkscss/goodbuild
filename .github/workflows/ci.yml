# Lint, typecheck, full tests and build (docs/DEPLOY.md, D45).
# Runs on every pull request. The Deploy workflow also calls it, so the exact commit on main is
# tested before it ships. Don't add a path filter here: a required check that never reports leaves
# a pull request unable to merge.
name: CI

on:
  pull_request:
  workflow_call:

# A new push to a pull request replaces its old run. A run called by Deploy is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the runner's size
        run: |
          nproc
          free -m

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      # The same major version as the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Also installs the publish-runtime workspace, which the build packs.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser comes from Playwright's own CDN. The runner's Ubuntu mirrors sometimes fail to
      # resolve for an hour, so apt (the system libraries) is only used if the browser can't start
      # without it, and then it retries.
      - name: Install the headless browser
        run: |
          pw="node node_modules/playwright-core/cli.js"
          $pw install chromium-headless-shell
          check='require("playwright-core").chromium.launch({headless:true}).then(b=>b.close()).then(()=>process.exit(0),e=>{console.error(e.message);process.exit(1)})'
          if ! node -e "$check"; then
            for attempt in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update -qq || true
              $pw install-deps chromium-headless-shell && break
              [ "$attempt" = 3 ] && exit 1
              sleep 30
            done
            node -e "$check"
          fi
        timeout-minutes: 10

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # PGlite and solc run in-process, so no database service or compiler download is needed.
      # Workers and timeouts come from vitest.config.mts.
      - name: Test
        run: pnpm test
        timeout-minutes: 20

      - name: Build
        run: pnpm build
        timeout-minutes: 10

      # Starts real containers in a throwaway project. It never touches production.
      - name: Test the release and rollback scripts
        run: bash deploy/test-release.sh
        timeout-minutes: 5

      # Real Postgres, age and MinIO in a throwaway project, with keys made up for the run (D47).
      # age is a pinned release from GitHub, checked against its hash, so the run doesn't depend on
      # the runner's Ubuntu mirrors.
      - name: Test the off-site backup and restore drill
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  age.tgz" | sha256sum -c -
          sudo tar xzf age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          rm age.tgz
          bash deploy/test-offsite-backup.sh
        timeout-minutes: 8
