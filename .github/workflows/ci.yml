# Lint, typecheck, full tests and build (docs/DEPLOY.md, D45).
# Runs on every pull request. The Deploy workflow also calls it, so the exact commit on main is
# tested before it ships. Don't add a path filter here: a required check that never reports leaves
# a pull request unable to merge.
name: CI

on:
  pull_request:
  workflow_call:

# A new push to a pull request replaces its old run. A run called by Deploy is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the runner's size
        run: |
          nproc
          free -m

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      # The same major version as the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Also installs the publish-runtime workspace, which the build packs.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The run check's tests open built apps in a real headless browser (D67). Without it they skip.
      # --with-deps also installs extra font packages through apt. The runner already has every library
      # the browser needs, so when Ubuntu's mirrors can't be reached (11 Nov 2026, every PR failed here
      # before a test ran) install the browser alone instead of failing the whole job.
      - name: Install the headless browser
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell \
            || { echo "::warning::apt could not install the browser's extra fonts; installing the browser alone"; node node_modules/playwright-core/cli.js install chromium-headless-shell; }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # PGlite and solc run in-process, so no database service or compiler download is needed.
      # Workers and timeouts come from vitest.config.mts.
      - name: Test
        run: pnpm test
        timeout-minutes: 20

      - name: Build
        run: pnpm build
        timeout-minutes: 10

      # Starts real containers in a throwaway project. It never touches production.
      - name: Test the release and rollback scripts
        run: bash deploy/test-release.sh
        timeout-minutes: 5

      # Real Postgres, age and MinIO in a throwaway project, with keys made up for the run (D47).
      - name: Test the off-site backup and restore drill
        # When Ubuntu's mirrors can't be reached, take age's own release from GitHub, pinned by its sha256.
        run: |
          if ! { sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null; }; then
            echo "::warning::apt couldn't install age; using age v1.2.1 from its GitHub release"
            curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
            echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  /tmp/age.tgz" | sha256sum -c -
            sudo tar -xzf /tmp/age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          fi
          bash deploy/test-offsite-backup.sh
        timeout-minutes: 8
