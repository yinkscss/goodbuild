<!doctype html><html><head><meta charset="utf-8"><title>FUTMinna banner</title><style>
@font-face{font-family:U;src:url(fonts/unbounded-800.ttf);font-weight:800}
@font-face{font-family:I;src:url(fonts/inter-500.ttf);font-weight:500}
@font-face{font-family:I;src:url(fonts/inter-600.ttf);font-weight:600}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:radial-gradient(120% 120% at 20% 0%,#EFE6F7,#E2D2F0);font-family:I,sans-serif;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.logos{display:flex;align-items:center;gap:14px;font-weight:600;font-size:24px;color:#1A0D26}
.logos img{width:60px;height:60px;border-radius:15px}.logos i{font-style:normal;color:#A6A6A6}
.eye{font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#592E81;margin-bottom:18px}
h1{font-family:U;font-weight:800;font-size:76px;line-height:.98;letter-spacing:-.03em;text-transform:uppercase;color:#1A0D26;max-width:800px}
h1 em{font-style:normal;color:#592E81}
.row{display:flex;gap:12px;align-items:center}
.chip{background:#fff;color:#592E81;font-weight:600;font-size:20px;padding:12px 22px;border-radius:9999px;box-shadow:0 1px 2px rgba(17,17,17,.03),0 18px 50px -24px rgba(89,46,129,.18)}
.go{background:#592E81;color:#fff;font-weight:600;font-size:20px;padding:12px 22px;border-radius:9999px}
.art{position:absolute;right:-40px;top:60px;width:430px;opacity:.95;filter:drop-shadow(0 30px 40px rgba(89,46,129,.25))}
</style></head><body>
<img class="art" src="goodbuild.png" alt="">
<div class="logos"><img src="goodbuild.png" alt=""><span>GoodBuild</span><i>×</i><img src="goodcash.png" alt=""><span>GoodCash</span></div>
<div><div class="eye">FUTMinna Hackathon</div><h1>Build something good. Win <em>₦150,000.</em></h1></div>
<div class="row"><span class="chip">Registration open</span><span class="chip">Closes 10 Dec</span><span class="go">goodbuildit.xyz/hackathon/futminna</span></div>
</body></html>
