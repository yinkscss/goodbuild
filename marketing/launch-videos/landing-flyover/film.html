<script>
const W = 1440, H = 1152, FOCAL = 1880, PAGE_W = 1440;
const TITLE1 = ['Live', 'on', 'mainnet.'], TITLE2 = ['Pay', 'as', 'you', 'build.'];
// ---------- helpers ----------

const pTab = (() => { const a = [0]; for (let i = 1; i <= 15000; i++) a.push(a[i - 1] + CRUISE * (speed((i - .5) / 1000)) / 1000); return a; })();
const pf = t => P0 + pTab[Math.min(15000, Math.round(Math.max(0, t) * 1000))];
const D0 = 1360, D1 = 1700, df = t => lerp(D0, D1, sm(t / 8.2));
const PAGE_H_REF = { v: 6673 };
const FOLD = [72, 80, 1368, 845];                  // hero fold = end card, page px
const END_S = 1018 / (FOLD[2] - FOLD[0]), END_D = FOCAL / END_S;

void main(){ vec2 p=vW.xy-vec2(0.,BL*.35); vec2 c=(MR.xy+MR.zw)*.5, h=(MR.zw-MR.xy)*.5; vec2 q=abs(p-c)-h+MRAD; float sd=length(max(q,0.))+min(max(q.x,q.y),0.)-MRAD; float al=.2*(1.-smoothstep(-BL*.5,BL,sd)); o=vec4(vec3(.102,.129,.2)*al,al); }`);
const pDepth = prog(VS_Q, `in vec2 vUV; in vec3 vW; in float vD; uniform sampler2D T; uniform float USEA; ${CLIP} out vec4 o; void main(){ float a=clipA(vW.xy); if(USEA>.5) a*=texture(T,vUV).a; if(a<.3) discard; o=vec4(vD,0,0,1); }`);
const VS_F = `in vec2 a; void main(){ gl_Position=vec4(a*2.-1.,0,1); }`;
const pFloor = prog(VS_F, `uniform vec2 R; out vec4 o; void main(){ vec2 p=(gl_FragCoord.xy/R-.5)*vec2(R.x/R.y,1.); float d=clamp(length(p)/length(vec2(R.x/R.y,1.)*.5),0.,1.); vec3 c=mix(vec3(.9765,.9843,.9843),vec3(.949,.9529,.9647),smoothstep(0.,1.,d)); o=vec4(c,1); }`);

float coc(float d){ return d<FOC ? min(120.,75.*(FOC-d)/d) : min(120.,6.*(d-FOC)/d); }

float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233))+SEED)*43758.5453); }

// ---------- assets ----------
