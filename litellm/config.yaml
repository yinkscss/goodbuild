# LiteLLM proxy for GoodBuild (D9, D14). Direct providers only, no OpenRouter.
# The app only ever asks for the two aliases below; change models here, not in code.
# Keys come from the environment (.env.local via `pnpm llm`, or your host's secrets).
model_list:
  - model_name: gb-strong # planning and code
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 16000
  - model_name: gb-cheap # fallback, titles, summaries, first auto-fix attempt
    litellm_params:
      # User asked for deepseek/deepseek-chat; DeepSeek's docs now list deepseek-flash (Q34).
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 16000

router_settings:
  # Provider error or timeout on the strong model: retry once, then fall back.
  num_retries: 1
  fallbacks:
    - gb-strong: ["gb-cheap"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  # Shared secret between the app and the proxy (LITELLM_MASTER_KEY in .env.local).
  master_key: os.environ/LITELLM_MASTER_KEY
