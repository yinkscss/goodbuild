# GoodBuild on one server (D27): Postgres, web and worker. See docs/DEPLOY.md.
# Coolify's Traefik owns ports 80 and 443 on this server and routes to the web service by label.
name: goodbuild

services:
  # Not called "postgres": web also joins Coolify's network, where that name is Coolify's own database.
  goodbuild-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goodbuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: goodbuild
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodbuild -d goodbuild"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: only the app can reach the database.

  migrate:
    image: goodbuild:latest
    command: ["pnpm", "db:migrate"]
    env_file: .env.production
    environment: &database
      DATABASE_URL: postgres://goodbuild:${POSTGRES_PASSWORD}@goodbuild-postgres:5432/goodbuild
    depends_on:
      goodbuild-postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: goodbuild:latest
    build:
      context: ..
      args:
        NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_TEST_GD_ADDRESS: ${NEXT_PUBLIC_TEST_GD_ADDRESS:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_TRANSAK_API_KEY: ${NEXT_PUBLIC_TRANSAK_API_KEY:-}
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *database
      GOODBUILD_INLINE_WORKER: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [default, coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.goodbuild.rule: Host(`${APP_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+\.${PUBLISHED_APPS_DOMAIN_REGEX}$$`)
      traefik.http.routers.goodbuild.entrypoints: https
      traefik.http.routers.goodbuild.tls: "true"
      traefik.http.services.goodbuild.loadbalancer.server.port: "3000"

  worker:
    image: goodbuild:latest
    command: ["pnpm", "worker"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *database
      TURN_CONCURRENCY: ${TURN_CONCURRENCY:-6}
      # The run check (D67): builds are opened in the checker's browser. If it is down, builds skip the check.
      RUN_CHECK_WS_ENDPOINT: ws://checker:3001/
      RUN_CHECK_CONCURRENCY: ${RUN_CHECK_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [default, checker]

  # The run check's browser (D67). Generated apps run in it, so it gets nothing: no secrets (no
  # env_file), no database (not on the default network) and no internet (its only network is internal).
  # The worker answers every request the page makes from memory.
  checker:
    image: goodbuild:latest
    command: ["node", "node_modules/playwright-core/cli.js", "run-server", "--port", "3001", "--host", "0.0.0.0"]
    restart: unless-stopped
    networks: [checker]
    # Measured on this server (9 Nov 2026): about 450 MB during one check and 720 MB with three at once.
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:

networks:
  coolify:
    external: true
  # Worker and checker only, with no route out.
  checker:
    internal: true
